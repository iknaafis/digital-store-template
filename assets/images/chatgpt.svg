<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="60%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="spiralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <!-- ChatGPT Spiral Shape -->
  <g transform="translate(200, 150) scale(1.15)" filter="url(#shadow)">
    <!-- Base circle -->
    <circle cx="0" cy="0" r="65" fill="#111827" opacity="0.3" />
    <!-- Spiral Path -->
    <path d="M 0,-45 
             C 10,-45 20,-35 20,-25 
             C 20,-15 10,-10 0,-10 
             C -10,-10 -20,-15 -20,-25 
             C -20,-35 -10,-45 0,-45 Z" fill="#34d399" opacity="0.9" transform="rotate(0) translate(0, 15)"/>
    <path d="M 0,-45 
             C 10,-45 20,-35 20,-25 
             C 20,-15 10,-10 0,-10 
             C -10,-10 -20,-15 -20,-25 
             C -20,-35 -10,-45 0,-45 Z" fill="#34d399" opacity="0.9" transform="rotate(60) translate(0, 15)"/>
    <path d="M 0,-45 
             C 10,-45 20,-35 20,-25 
             C 20,-15 10,-10 0,-10 
             C -10,-10 -20,-15 -20,-25 
             C -20,-35 -10,-45 0,-45 Z" fill="#34d399" opacity="0.9" transform="rotate(120) translate(0, 15)"/>
    <path d="M 0,-45 
             C 10,-45 20,-35 20,-25 
             C 20,-15 10,-10 0,-10 
             C -10,-10 -20,-15 -20,-25 
             C -20,-35 -10,-45 0,-45 Z" fill="#34d399" opacity="0.9" transform="rotate(180) translate(0, 15)"/>
    <path d="M 0,-45 
             C 10,-45 20,-35 20,-25 
             C 20,-15 10,-10 0,-10 
             C -10,-10 -20,-15 -20,-25 
             C -20,-35 -10,-45 0,-45 Z" fill="#34d399" opacity="0.9" transform="rotate(240) translate(0, 15)"/>
    <path d="M 0,-45 
             C 10,-45 20,-35 20,-25 
             C 20,-15 10,-10 0,-10 
             C -10,-10 -20,-15 -20,-25 
             C -20,-35 -10,-45 0,-45 Z" fill="#34d399" opacity="0.9" transform="rotate(300) translate(0, 15)"/>
  </g>
</svg>
