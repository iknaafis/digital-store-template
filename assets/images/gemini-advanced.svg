<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <!-- Sparkle Shape -->
  <g transform="translate(200, 150) scale(1.3)" filter="url(#glow)">
    <path d="M0,-80 C1,-20 20,-1 80,0 C20,1 1,20 0,80 C-1,20 -20,1 -80,0 C-20,-1 -1,-20 0,-80 Z" fill="url(#sparkGrad)" />
    <!-- Center highlight -->
    <circle cx="0" cy="0" r="10" fill="#ffffff" opacity="0.8" />
  </g>
  <!-- Tiny helper stars -->
  <path d="M280,70 C280.5,85 285,89.5 300,90 C285,90.5 280.5,95 280,110 C279.5,95 275,90.5 260,90 C275,89.5 279.5,85 280,70 Z" fill="#38bdf8" opacity="0.7" />
  <path d="M100,200 C100.5,210 104,213.5 114,214 C104,214.5 100.5,218 100,228 C99.5,218 96,214.5 86,214 C96,213.5 99.5,210 100,200 Z" fill="#fb923c" opacity="0.7" />
</svg>
