<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0b132b" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#48cae4" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <!-- NordVPN Shield and Mountain -->
  <g transform="translate(200, 150) scale(1.1)" filter="url(#shadow)">
    <!-- Outer Shield Outline -->
    <path d="M-60,-50 C-60,-50 0,-65 0,-65 C0,-65 60,-50 60,-50 C60,0 50,45 0,75 C-50,45 -60,0 -60,-50 Z" fill="url(#shieldGrad)" />
    <!-- Inner Shield (Darker) -->
    <path d="M-52,-45 C-52,-45 0,-58 0,-58 C0,-58 52,-45 52,-45 C52,0 43,40 0,67 C-43,40 -52,0 -52,-45 Z" fill="#0b132b" />
    <!-- Mountain Silhouette -->
    <path d="M-35,30 L-10,-20 L8,15 L18,-3 L35,30 Z" fill="#ffffff" />
    <!-- Snow peak highlight -->
    <path d="M-10,-20 L-5,-10 L-15,-10 Z" fill="#48cae4" />
    <path d="M18,-3 L21,3 L15,3 Z" fill="#48cae4" />
  </g>
</svg>
