<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="60%" stop-color="#181818" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <!-- Spotify Circular Logo -->
  <g transform="translate(200, 150) scale(1.1)" filter="url(#shadow)">
    <!-- Spotify Green Circle -->
    <circle cx="0" cy="0" r="60" fill="#1db954" />
    <!-- Three waves (black curves) -->
    <!-- Top Wave -->
    <path d="M-38,-14 C-10,-28 20,-24 38,-11" fill="none" stroke="#121212" stroke-width="8" stroke-linecap="round" />
    <!-- Middle Wave -->
    <path d="M-33,6 C-8,-6 18,-4 33,6" fill="none" stroke="#121212" stroke-width="7.5" stroke-linecap="round" />
    <!-- Bottom Wave -->
    <path d="M-28,24 C-6,14 15,15 28,23" fill="none" stroke="#121212" stroke-width="6.5" stroke-linecap="round" />
  </g>
</svg>
